
name: Update GitHub Contribution Chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution chart
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: GhostR41
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            contributions.svg?period=365&granularity=week&theme=dark
            contributions-90d.svg?period=90&granularity=day&theme=dark
