
name: Update GitHub Contribution Chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution chart
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: GhostR41
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            contributions.svg?period=365&granularity=week&style=clean&theme=dark

      - name: Refresh chart image URL
        env:
          IMAGE_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("README.md")
          text = path.read_text()

          url = "https://raw.githubusercontent.com/GhostR41/GhostR41/output/contributions.svg"
          replacement = f"{url}?v={os.environ['IMAGE_VERSION']}"
          pattern = re.escape(url) + r"(?:\?v=[^)\s\"']*)?"

          updated, count = re.subn(
              pattern, lambda _: replacement, text
          )

          if count == 0:
              raise SystemExit("Contribution image URL not found in README.md")

          path.write_text(updated)
          PY

      - name: Commit refreshed image URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution chart image"
            git push
          fi
